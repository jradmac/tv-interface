<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  html,body{height:100%;overflow:hidden;background:#0B0B0D;cursor:none}
  /* A soft glow of the game behind the screen fills the TV's sides. It is blurred in the
     canvas itself (a CSS blur on a full-screen layer is slow on the box and drew stale tiles). */
  #glow{position:fixed;inset:0;width:100%;height:100%;opacity:.35;transition:opacity .4s}
  /* The top screen, always centered. Fit: 4:3, as big as fits. Fill: 4:3, big enough to cover
     the TV (the top and bottom edges are cut off). Stretch: the whole TV. */
  #stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;
         width:min(100vw,133.334vh);height:min(100vh,75vw);transition:width .35s var(--ease),height .35s var(--ease)}
  body.v-fill #stage{width:max(100vw,133.334vh);height:max(100vh,75vw)}
  body.v-stretch #stage{width:100vw;height:100vh}
  body.v-fill #glow,body.v-stretch #glow{opacity:0}
  #top{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  /* Bottom screen, shown on the TV only when no phone is holding it (a Bluetooth controller). */
  #bot{position:fixed;right:28px;bottom:28px;width:23vw;aspect-ratio:4/3;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);
       image-rendering:pixelated;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s var(--ease)}
  body.showbot #bot{opacity:1;transform:none}
  #note{position:fixed;left:50%;bottom:6vh;transform:translate(-50%,10px);background:rgba(20,20,22,.82);color:#F3F1EC;backdrop-filter:blur(10px);
        font:500 22px Inter,system-ui,sans-serif;padding:14px 26px;border-radius:999px;opacity:0;transition:opacity .35s,transform .35s var(--ease);white-space:nowrap}
  #note.on{opacity:1;transform:translate(-50%,0)}
  #hello{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#F3F1EC;
         font:500 26px Inter,system-ui,sans-serif;background:#0B0B0D;transition:opacity .6s}
  #hello b{font-size:44px;font-weight:600;letter-spacing:-.01em}
  #hello span{color:#9A968E;font-size:22px}
  #hello.off{opacity:0;pointer-events:none}
  #hello.gone{display:none}
  #paused{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font:600 40px Inter,system-ui}
  body.paused #paused{display:flex}
</style>
</head>
<body class="v-fit">
<canvas id="glow" width="64" height="48"></canvas>
<div id="stage"><canvas id="top" width="256" height="192"></canvas></div>
<canvas id="bot" width="256" height="192"></canvas>
<div id="paused">Paused</div>
<div id="hello"><b id="title">Starting your game</b><span id="sub">Turn your phone sideways to play</span></div>
<div id="note"></div>
<script src="tv.js"></script>
</body>
</html>
