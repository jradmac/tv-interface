<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- TV Remote app icon: one card in a quiet room. Full bleed; iOS rounds the corners. -->
  <defs>
    <radialGradient id="room" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#E9E5DC"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2C29"/>
      <stop offset="1" stop-color="#151413"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="34"/>
      <feOffset dy="44"/>
      <feComponentTransfer><feFuncA type="linear" slope=".30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#room)"/>
  <g filter="url(#lift)">
    <rect x="182" y="290" width="660" height="400" rx="84" fill="url(#card)"/>
  </g>
  <!-- The card's own quiet details: a title line and an Open pill, like the TV cards. -->
  <rect x="252" y="370" width="230" height="40" rx="20" fill="#F3F1EC" opacity=".92"/>
  <rect x="252" y="432" width="150" height="26" rx="13" fill="#F3F1EC" opacity=".35"/>
  <rect x="646" y="586" width="126" height="44" rx="22" fill="none" stroke="#F3F1EC" stroke-opacity=".55" stroke-width="6"/>
  <rect x="446" y="782" width="96" height="30" rx="15" fill="#1C1B19"/>
  <circle cx="584" cy="797" r="15" fill="#C4BEB3"/>
  <circle cx="404" cy="797" r="15" fill="#C4BEB3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
