<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0E">
<title>Mario &amp; Luigi</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0C0C0E;color:rgba(255,255,255,.9);font-family:-apple-system,system-ui,Inter,sans-serif}
  body{background:radial-gradient(60% 90% at 0% 100%,rgba(229,72,59,.16),transparent 70%),radial-gradient(60% 90% at 100% 0%,rgba(63,174,73,.13),transparent 70%),#0C0C0E}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2.5vmin}
  canvas{height:100%;max-width:100%;aspect-ratio:4/3;image-rendering:pixelated;background:#000;border-radius:1.4vmin;opacity:0;transition:opacity .6s;
         box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px -30px rgba(229,72,59,.35),0 20px 60px rgba(0,0,0,.5)}
  canvas.on{opacity:1}
  #idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;text-align:center;padding:6vmin}
  #idle h1{font-size:7vmin;font-weight:800;letter-spacing:-.02em}
  #idle h1 b:first-child{color:#EE5A4D} #idle h1 b:last-child{color:#4CC157}
  #idle p{font-size:2.6vmin;color:rgba(255,255,255,.5);max-width:80vmin;line-height:1.45}
  #go{margin-top:2vmin;height:7vmin;padding:0 5vmin;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;
      font:600 2.4vmin -apple-system,system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(12px)}
  #go:hover{background:rgba(255,255,255,.14)}
  #tag{position:fixed;left:2.5vmin;top:2.5vmin;padding:.8vmin 1.6vmin;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);
       font-size:1.5vmin;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.75);transition:opacity 1s;backdrop-filter:blur(8px)}
  body.quiet #tag{opacity:0}
  body.playing{cursor:none}
  #snd{position:fixed;left:50%;bottom:3.5vmin;transform:translateX(-50%);padding:1.4vmin 3vmin;border-radius:999px;border:1px solid rgba(255,255,255,.2);
       background:rgba(0,0,0,.55);color:#fff;font:600 2vmin -apple-system,system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(10px);display:none}
  body.playing.mute #snd{display:block;cursor:pointer}
  body.playing.mute{cursor:pointer}
</style>
</head>
<body>
<div class="stage"><canvas id="cv" width="256" height="192"></canvas></div>
<div id="idle">
  <h1><b>Mario</b> &amp; <b>Luigi</b></h1>
  <p id="msg">Mario’s screen will show up here, with sound.</p>
  <button id="go">Start watching</button>
</div>
<div id="tag"></div>
<button id="snd">🔊 Click for sound</button>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const code = (location.pathname.match(/\/w\/([A-Za-z]{4})/) || [])[1] || '';
  const key = new URLSearchParams(location.search).get('k') || '';
  const cv = $('cv'), ctx = cv.getContext('2d');
  $('tag').textContent = 'MARIO & LUIGI · ' + code.toUpperCase();
  let ws = null, actx = null, nextAt = 0, busy = false, lastPic = 0, ended = false, retry = 0;

  // Sound from Mario's phone: kind 10, then the sample rate (u32), then 16-bit stereo.
  function sound(buf) {
    if (!actx) return;
    const dv = new DataView(buf), rate = dv.getUint32(1, true), pcm = new Int16Array(buf.slice(5)), n = pcm.length >> 1;
    if (!n || rate < 8000 || rate > 96000) return;
    const ab = actx.createBuffer(2, n, rate), L = ab.getChannelData(0), R = ab.getChannelData(1);
    for (let i = 0; i < n; i++) { L[i] = pcm[2 * i] / 32768; R[i] = pcm[2 * i + 1] / 32768; }
    const now = actx.currentTime;
    if (nextAt < now + 0.02) nextAt = now + 0.06;   // ran dry: a small cushion
    if (nextAt > now + 0.25) return;                 // too far behind: skip to catch up
    const src = actx.createBufferSource(); src.buffer = ab; src.connect(actx.destination); src.start(nextAt);
    nextAt += n / rate;
  }
  function picture(buf) {
    if (busy) return; busy = true;
    createImageBitmap(new Blob([buf], { type: 'image/jpeg' })).then((bm) => {
      ctx.drawImage(bm, 0, 0); bm.close && bm.close(); lastPic = performance.now();
      if (!cv.classList.contains('on')) { cv.classList.add('on'); document.body.classList.toggle('mute', !actx); $('idle').style.display = 'none'; document.body.classList.add('playing'); setTimeout(() => document.body.classList.add('quiet'), 6000); }
    }).catch(() => {}).finally(() => { busy = false; });
  }
  setInterval(() => {
    if (lastPic && performance.now() - lastPic > 4000) { cv.classList.remove('on'); $('idle').style.display = 'flex'; $('go').style.display = 'none'; $('msg').textContent = 'Waiting for Mario’s phone…'; document.body.classList.remove('playing', 'quiet'); lastPic = 0; }
  }, 1000);

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const s = new WebSocket(`${proto}//${location.host}/ws?role=watch&room=${encodeURIComponent(code)}&k=${encodeURIComponent(key)}`);
    s.binaryType = 'arraybuffer'; ws = s;
    s.onopen = () => { retry = 0; s.send(JSON.stringify({ t: 'sound', on: !!actx })); };
    s.onmessage = (e) => {
      if (typeof e.data === 'string') {
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.t === 'error' || m.t === 'ended') { ended = true; cv.classList.remove('on'); $('idle').style.display = 'flex'; $('go').style.display = 'none'; $('msg').textContent = m.msg || 'The game has ended.'; }
        else if (m.t === 'room' && !lastPic) $('msg').textContent = m.host ? `Showing ${m.host.name}’s screen as soon as it starts…` : 'Waiting for Mario’s phone…';
        return;
      }
      const u = new Uint8Array(e.data);
      if (u[0] === 9) picture(u.subarray(1)); else if (u[0] === 10) sound(e.data);
    };
    s.onclose = () => { if (ended) return; setTimeout(connect, Math.min(5000, 600 * ++retry)); };
  }
  // A click is needed before a browser plays sound; the picture starts either way.
  function start() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); actx.resume(); } catch { actx = null; } }
    document.body.classList.remove('mute');
    $('go').style.display = 'none'; if (!lastPic) $('msg').textContent = 'Waiting for Mario’s phone…';
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch {}
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'sound', on: !!actx }));
  }
  $('go').onclick = start;
  // The picture can start before anyone clicks: then a click anywhere turns the sound on.
  document.addEventListener('click', () => { if (!actx && lastPic) start(); });
  document.addEventListener('keydown', (e) => { if (!actx && lastPic && (e.key === 'Enter' || e.key === ' ')) start(); });
  if (!code || !key) { $('msg').textContent = 'This link is missing its code. Make a new one in the game menu.'; $('go').style.display = 'none'; }
  else connect();
})();
</script>
</body>
</html>
